name: links

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    name: External link integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200..=206,403,429
            --timeout 20
            --max-concurrency 8
            "scientific-skills/**/*.md"
            "README.md"
            "CONTRIBUTING.md"
          fail: true
