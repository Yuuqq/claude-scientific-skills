# External link checker config for the weekly `links` workflow.
# Placeholder DOI examples are written as inline code so they are not checked.
# The excludes below cover official hosts that still 200 in a browser but
# reject or drop automated probes from GitHub Actions.

verbose = "info"
no_progress = true
max_redirects = 10
max_retries = 3
retry_wait_time = 2
max_concurrency = 8
timeout = 20
accept = ["200..=206", "301..=303", "403", "429"]

exclude = [
  # Product dashboards that fail HTTP/2 probes from CI
  '^https://modal\.com/(apps|secrets)/?$',
  # Canonical Paul Tol palette page; often drops CI connections
  '^https://personal\.sron\.nl/~pault/',
  # Third-party hosts that refuse or reset GitHub Actions connections
  '^https://developer\.uspto\.gov/',
  '^https://pennylane\.ai/',
  '^https://colorable\.jxnblk\.com/',
  '^https://(www\.)?recomb\.org/',
]
